title: Remote Script Downloaded and Piped Straight Into a Shell
id: 130d3ffb-d220-4218-8d44-d0e99d42b607
status: test
description: |
  "curl http://... | sh" runs whatever the server sends without it ever touching
  disk for review. Install docs do this too, but on a server it's also how
  attackers pull their tooling after getting in through a web app.
author: NavyBoy37
date: 2026-11-06
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command-and-control
  - attack.t1105
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|re: '(curl|wget)\s.*\|\s*(sudo\s+)?(ba|z|da)?sh\b'
  condition: selection
falsepositives:
  - Admins installing tools from vendor one-liners (Docker, Homebrew, rustup)
level: medium
