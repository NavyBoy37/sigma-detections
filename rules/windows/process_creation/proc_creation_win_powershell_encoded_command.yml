title: PowerShell Launched With an Encoded Command
id: 1e986cbf-0806-43b0-a298-a956fdb800cd
status: test
description: |
  -EncodedCommand takes a base64 script so the real command never shows up in
  plain text on the command line. Admin tools use it occasionally, but it's one
  of the most common ways malware and phishing droppers launch their next stage.
  Matches the shortened forms too (-enc, -ec, -e) since PowerShell accepts any
  unambiguous prefix.
author: NavyBoy37
date: 2026-11-06
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - \powershell.exe
      - \pwsh.exe
  selection_flag:
    CommandLine|re: '(?i)\s[-/]e(c|nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
  condition: selection_image and selection_flag
falsepositives:
  - Some management agents (SCCM, RMM tools) wrap their scripts this way. Allowlist them by ParentImage.
level: high
